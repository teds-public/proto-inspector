syntax = "proto3";

package game.net;

import "game.proto";
import "google/protobuf/timestamp.proto";

// Demonstrates imports between uploaded files and a bundled well-known type.

message Frame {
  uint32 sequence = 1;
  google.protobuf.Timestamp observed_at = 2;
  oneof body {
    game.LoginRequest login = 3;
    game.LoginResponse login_response = 4;
    game.ChatMessage chat = 5;
  }
}
